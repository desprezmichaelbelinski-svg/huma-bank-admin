<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUMA BANK — Dashboard Administrateur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --navy-950:#040B18; --navy-900:#081831; --navy-800:#0C2350; --navy-700:#153274; --navy-600:#2748A0; --navy-500:#3E5FC4;
  --navy-100:#E8EDF8; --navy-50:#F3F6FC; --white:#FFFFFF; --surface:#FFFFFF; --ink:#0A1B3D; --muted:#647096; --muted-2:#8792B0;
  --line:#E2E8F5; --pos:#1B8F5A; --pos-bg:#E7F6EE; --neg:#C4433F; --neg-bg:#FBEAEA; --warn:#A9761B; --warn-bg:#FDF3DC;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:'Inter',sans-serif;background:var(--navy-50);color:var(--ink);}
h1,h2,h3,.display{font-family:'Manrope',sans-serif;}
.tnum{font-variant-numeric:tabular-nums;}
button{font-family:inherit;cursor:pointer;}
.cur{height:0.85em;width:auto;vertical-align:-0.12em;filter:brightness(0);margin-right:2px;}

/* ---------- LOGIN GATE ---------- */
#gate{position:fixed;inset:0;background:radial-gradient(120% 100% at 50% 0%,var(--navy-700) 0%,var(--navy-900) 55%,var(--navy-950) 100%);display:flex;align-items:center;justify-content:center;z-index:999;}
.gate-card{width:380px;max-width:90vw;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:36px 30px;color:#fff;}
.gate-card .mark{width:44px;height:44px;border-radius:12px;background:#fff;color:var(--navy-900);display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;font-size:18px;margin-bottom:14px;}
.gate-card h1{font-size:19px;margin:0 0 4px;}
.gate-card p{color:#A9B8E4;font-size:12.5px;margin:0 0 22px;}
.gate-card input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:#fff;font-size:14px;margin-bottom:12px;outline:none;}
.gate-card button{width:100%;padding:13px;border-radius:12px;border:none;background:#fff;color:var(--navy-900);font-weight:700;font-size:13.5px;}
.gate-hint{margin-top:16px;font-size:11px;color:#8CA0DE;line-height:1.7;}
.gate-err{color:#F3A6A6;font-size:12px;margin:-6px 0 10px;}

/* ---------- SHELL ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:250px;flex-shrink:0;background:linear-gradient(180deg,var(--navy-950),var(--navy-800));color:#fff;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px;
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 10px;}
.sb-brand .mark{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--navy-900);display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;font-size:15px;flex-shrink:0;}
.sb-brand .txt b{display:block;font-family:'Manrope';font-weight:800;font-size:14.5px;}
.sb-brand .txt span{display:block;font-size:10.5px;color:#96A8DC;}
.sb-school{margin:6px 8px 18px;font-size:11px;color:#7C8BC0;border-top:1px solid rgba(255,255,255,.1);padding-top:12px;}
.sb-nav{flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.sb-link{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;background:none;border:none;color:#B9C6EE;font-size:13px;font-weight:600;text-align:left;width:100%;}
.sb-link:hover{background:rgba(255,255,255,.06);}
.sb-link.active{background:rgba(255,255,255,.12);color:#fff;}
.sb-link .badge-mini{margin-left:auto;background:var(--neg);color:#fff;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:10px;}
.sb-logout{margin-top:10px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:15;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:14px 28px;}
.search-wrap{flex:1;max-width:420px;display:flex;align-items:center;gap:9px;background:var(--navy-50);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--muted);}
.search-wrap input{border:none;background:none;outline:none;flex:1;font-size:13px;color:var(--ink);font-family:inherit;}
.top-actions{display:flex;align-items:center;gap:10px;margin-left:auto;}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative;}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--neg);border:1.5px solid var(--surface);}
.top-profile{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:30px;}
.top-profile .av{width:30px;height:30px;border-radius:50%;background:var(--navy-800);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'Manrope';}
.top-profile b{font-size:12.5px;}
.top-profile small{display:block;color:var(--muted);font-size:10.5px;}

.content{padding:26px 28px 60px;max-width:1400px;}
.page-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.page-title h1{font-size:22px;margin:0;}
.page-title p{color:var(--muted);font-size:12.5px;margin:3px 0 0;}

/* ---------- COMPONENTS (reused patterns) ---------- */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
.kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;min-width:0;overflow:hidden;}
.kpi-card .kl{font-size:12px;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:8px;}
.kpi-card .kv{font-family:'Manrope';font-weight:800;font-size:24px;margin:0;}
.kpi-card .kd{font-size:11px;margin-top:6px;font-weight:700;}
.kicon{width:34px;height:34px;border-radius:10px;background:var(--navy-100);color:var(--navy-700);display:flex;align-items:center;justify-content:center;}

.grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:22px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0;overflow:hidden;}
.card canvas{max-width:100%;display:block;}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.card-head h3{font-size:14.5px;margin:0;}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap;}
.pill{border:1px solid var(--line);background:var(--navy-50);border-radius:20px;padding:6px 13px;font-size:11.5px;font-weight:700;color:var(--muted);}
.pill.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}

.table{width:100%;border-collapse:collapse;}
.table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted-2);padding:0 12px 10px;font-weight:700;}
.table td{padding:12px;border-top:1px solid var(--line);font-size:12.5px;}
.table tr:hover td{background:var(--navy-50);cursor:pointer;}
.name-cell{display:flex;align-items:center;gap:10px;}
.av-sm{width:32px;height:32px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'Manrope';flex-shrink:0;}
.badge{font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;display:inline-block;}
.badge.ok{background:var(--pos-bg);color:var(--pos);}
.badge.pending{background:var(--warn-bg);color:var(--warn);}
.badge.fail{background:var(--neg-bg);color:var(--neg);}
.badge.mut{background:var(--navy-100);color:var(--muted);}

.subnav{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.subnav button{background:none;border:none;padding:10px 4px;margin-right:18px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;}
.subnav button.active{color:var(--navy-800);border-color:var(--navy-800);}

.btn{border:none;border-radius:10px;padding:9px 15px;font-size:12px;font-weight:700;}
.btn.primary{background:var(--navy-800);color:#fff;}
.btn.ghost{background:var(--navy-50);color:var(--ink);border:1px solid var(--line);}
.btn.danger{background:var(--neg-bg);color:var(--neg);}
.btn.ok{background:var(--pos-bg);color:var(--pos);}

.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(4,11,24,.5);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s;}
.modal-bg.open{opacity:1;pointer-events:auto;}
.modal-box{background:var(--surface);border-radius:20px;width:460px;max-width:92vw;max-height:86vh;overflow-y:auto;padding:24px;transform:scale(.96);transition:transform .18s;}
.modal-bg.open .modal-box{transform:scale(1);}
.modal-box h3{margin:0 0 14px;font-size:16px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px;}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:13px;font-family:inherit;outline:none;}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:12.5px;border-top:1px solid var(--line);}
.summary-row:first-child{border-top:none;}
.close-x{position:absolute;top:18px;right:18px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;}

.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--navy-900);color:#fff;padding:12px 20px;border-radius:30px;font-size:12.5px;font-weight:600;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}

.toggle{width:40px;height:23px;border-radius:20px;background:var(--line);position:relative;border:none;flex-shrink:0;}
.toggle.on{background:var(--navy-700);}
.toggle::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2.5px;left:3px;transition:.15s;}
.toggle.on::after{left:19px;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);}
.settings-row:first-child{border-top:none;}
.settings-row .st{font-size:13px;font-weight:600;}
.settings-row small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:2px;}

.code-box{background:var(--navy-50);border:1.5px dashed var(--navy-600);border-radius:16px;padding:20px;text-align:center;}
.code-box .cl{font-size:11.5px;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;}
.code-box .cv{font-family:'Manrope';font-weight:800;font-size:26px;letter-spacing:6px;margin:0;}

/* DIDACTICIEL — tutoriel de bienvenue */
#didacticiel{position:fixed;inset:0;z-index:998;background:radial-gradient(120% 100% at 50% 0%,var(--navy-700) 0%,var(--navy-900) 55%,var(--navy-950) 100%);display:flex;align-items:center;justify-content:center;padding:20px;}
#didacticiel.hidden{display:none;}
.tuto-card{width:100%;max-width:420px;color:#fff;text-align:center;}
.tuto-card .ti{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:#fff;}
.tuto-card h2{font-family:'Manrope';font-weight:800;font-size:21px;margin:0 0 10px;}
.tuto-card p{color:#B9C6EE;font-size:13.5px;line-height:1.7;margin:0 0 26px;}
.tuto-dots{display:flex;justify-content:center;gap:6px;margin-bottom:22px;}
.tuto-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);}
.tuto-dots span.on{background:#fff;width:20px;border-radius:5px;transition:.2s;}
.tuto-actions{display:flex;gap:10px;}
.tuto-actions button{flex:1;padding:14px;border-radius:14px;font-weight:700;font-size:13.5px;border:none;}
.tuto-skip{background:rgba(255,255,255,.08);color:#B9C6EE;}
.tuto-next{background:#fff;color:var(--navy-900);}

@media (max-width:980px){
  .sidebar{width:76px;}
  .sb-brand .txt,.sb-school,.sb-link span{display:none;}
  .sb-link{justify-content:center;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .grid-2{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-card" id="gate-card">
    <div class="mark">H</div>
    <h1>HUMA BANK — Administration</h1>
    <p>Centre de contrôle des comptes de l'établissement</p>
    <div id="gate-body">Chargement…</div>
  </div>
</div>
<div id="app"></div>
<div id="didacticiel" class="hidden"></div>
<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<script>
/* ============================================================
   ICONS
============================================================ */
const ICONS = {
  home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1V15h4v4.5a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1V10"/>',
  users:'<circle cx="8.5" cy="8" r="3"/><path d="M2.5 20.5c0-3.6 2.8-6 6-6s6 2.4 6 6"/><circle cx="16.5" cy="8" r="2.8"/><path d="M14.5 3.7a2.8 2.8 0 0 1 0 8.6"/><path d="M15 14.7c2.4.4 4.5 2.5 4.5 5.8"/>',
  bank:'<rect x="4.5" y="3" width="15" height="18" rx="1.5"/><path d="M9.5 21v-4.5h5V21"/><path d="M8 7.5h1.2M14.8 7.5H16M8 11.5h1.2M14.8 11.5H16"/>',
  card:'<rect x="2.5" y="5.5" width="19" height="13" rx="3"/><path d="M2.5 10h19"/><path d="M6 14.5h4"/>',
  trend:'<path d="M3 17 9 10l4 3 8-9"/><path d="M15 3.5h6V9.5"/>',
  food:'<path d="M5 3v7a2.4 2.4 0 0 0 2.4 2.4V21"/><path d="M8.7 3v6.4"/><path d="M15 3c-1.8 0-3 2.2-3 5s1.2 4.6 3 4.6V21"/>',
  chart:'<path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16l3.5-5 3 3L19 8"/>',
  shield:'<path d="M12 2.5 20 6v6c0 5.2-3.6 8.9-8 10.5-4.4-1.6-8-5.3-8-10.5V6l8-3.5Z"/><path d="m9 12 2 2 4-4.2"/>',
  bell:'<path d="M6.5 8.5a5.5 5.5 0 0 1 11 0c0 5 2 6.3 2 6.3H4.5s2-1.3 2-6.3Z"/><path d="M10 18a2 2 0 0 0 4 0"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2.1 2.1 0 1 1-3 3l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2.1 2.1 0 1 1-4.2 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2.1 2.1 0 1 1-3-3l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2.1 2.1 0 1 1 0-4.2h.1A1.7 1.7 0 0 0 4.7 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2.1 2.1 0 1 1 3-3l.1.1a1.7 1.7 0 0 0 1.9.3H9.4A1.7 1.7 0 0 0 10.4 3V3a2.1 2.1 0 1 1 4.2 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2.1 2.1 0 1 1 3 3l-.1.1a1.7 1.7 0 0 0-.3 1.9V9.4a1.7 1.7 0 0 0 1.6 1H21a2.1 2.1 0 1 1 0 4.2h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
  logout:'<path d="M9.5 20.5H6a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2h3.5"/><path d="M16.5 16.5 21 12l-4.5-4.5"/><path d="M21 12H9.5"/>',
  search:'<circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/>',
  alert:'<path d="M12 9v4.2"/><circle cx="12" cy="16.5" r=".6" fill="currentColor" stroke="none"/><path d="M10.6 3.5 1.9 18.2A1.9 1.9 0 0 0 3.6 21h16.8a1.9 1.9 0 0 0 1.7-2.8L13.4 3.5a1.9 1.9 0 0 0-2.8 0Z"/>',
  lock:'<rect x="4.5" y="11" width="15" height="9.5" rx="2.2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  wallet:'<path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h11A2.5 2.5 0 0 1 19 7.5V8H5.5A2.5 2.5 0 0 1 3 5.5"/><path d="M3 8v9a2.5 2.5 0 0 0 2.5 2.5H19A2 2 0 0 0 21 17.5v-7A2 2 0 0 0 19 8.5H5"/><circle cx="16.2" cy="13.5" r="1.3"/>',

const ACCOUNTS = {};
const RECHARGE_REQUESTS = [];
const WITHDRAW_REQUESTS = [];
const SECURITY_LOG = [];
const PARENT_PENDING = [];

function todayStr2(d){
  const days = Math.floor((Date.now()-d.getTime())/86400000);
  if(days<=0) return "Aujourd'hui";
  if(days===1) return 'Hier';
  return d.toLocaleDateString('fr-FR');
}
async function loadFromSupabase(){
  const [accRes, cardRes, txRes, notifRes, rcRes, wdRes, secRes, setRes, ppRes] = await Promise.all([
    sb.from('accounts').select('*'),
    sb.from('cards').select('*'),
    sb.from('transactions').select('*').order('created_at',{ascending:false}),
    sb.from('notifications').select('*').order('created_at',{ascending:false}),
    sb.from('recharge_requests').select('*').order('created_at',{ascending:false}),
    sb.from('withdraw_requests').select('*').order('created_at',{ascending:false}),
    sb.from('security_log').select('*').order('created_at',{ascending:false}).limit(50),
    sb.from('app_settings').select('*').eq('key','school').maybeSingle(),
    sb.from('parent_pending').select('*').order('created_at',{ascending:false}),
  ]);
  PARENT_PENDING.length=0;
  (ppRes.data||[]).forEach(p=>PARENT_PENDING.push({
    code:p.code, relation:p.relation, fatherNom:p.father_nom, fatherPrenom:p.father_prenom,
    motherNom:p.mother_nom, motherPrenom:p.mother_prenom, auntNom:p.aunt_nom, auntPrenom:p.aunt_prenom,
    uncleNom:p.uncle_nom, unclePrenom:p.uncle_prenom, eleveNom:p.eleve_nom, elevePrenom:p.eleve_prenom,
    classe:p.classe, status:p.status, date:new Date(p.created_at),
  }));
  SECURITY_LOG.length=0;
  (secRes.data||[]).forEach(l=>{
    SECURITY_LOG.push({date:new Date(l.created_at), user:l.user_name||'Inconnu', action:l.action, device:l.device||'—', result:l.result});
  });
  if(setRes.data && setRes.data.value){ Object.assign(settings, setRes.data.value); }
  for(const k in ACCOUNTS) delete ACCOUNTS[k];
  (accRes.data||[]).forEach(a=>{
    ACCOUNTS[a.number] = {
      number:a.number, nom:a.nom, prenom:a.prenom, role:a.role, classe:a.classe,
      name:a.prenom+' '+a.nom, balance:Number(a.balance), status:a.status, accountType:a.account_type, password:a.password,
      eleveNom:a.eleve_nom, elevePrenom:a.eleve_prenom, relation:a.relation,
      cards:[], transactions:[], notifications:[], createdAt:new Date(a.created_at),
    };
  });
  (cardRes.data||[]).forEach(c=>{
    const acc=ACCOUNTS[c.account_number]; if(!acc) return;
    acc.cards.push({id:c.id, holder:c.holder, last4:c.last4, frozen:c.frozen, cardBalance:Number(c.card_balance)});
  });
  (txRes.data||[]).forEach(t=>{
    const acc=ACCOUNTS[t.account_number]; if(!acc) return;
    const d=new Date(t.created_at);
    acc.transactions.push({id:t.id, desc:t.description, cat:t.category, amount:Number(t.amount), date:d, label:todayStr2(d)});
  });
  (notifRes.data||[]).forEach(n=>{
    const acc=ACCOUNTS[n.account_number]; if(!acc) return;
    acc.notifications.push({id:n.id, text:n.text, read:n.read, date:new Date(n.created_at)});
  });
  RECHARGE_REQUESTS.length=0;
  (rcRes.data||[]).forEach(r=>{
    const acc=ACCOUNTS[r.account_number];
    RECHARGE_REQUESTS.push({id:r.id, accountNumber:r.account_number, name:acc?acc.name:r.account_number, method:r.method, amount:Number(r.amount), ref:r.ref, status:r.status, date:new Date(r.created_at)});
  });
  WITHDRAW_REQUESTS.length=0;
  (wdRes.data||[]).forEach(r=>{
    const acc=ACCOUNTS[r.account_number];
    WITHDRAW_REQUESTS.push({id:r.id, accountNumber:r.account_number, name:acc?acc.name:r.account_number, amount:Number(r.amount), fee:Number(r.fee), total:Number(r.total), status:r.status, date:new Date(r.created_at)});
  });
}
async function syncAll(){ await loadFromSupabase(); if(document.getElementById('gate').style.display==='none') renderPage(); }
function startRealtime(){
  sb.channel('admin-sync')
    .on('postgres_changes', {event:'*', schema:'public', table:'accounts'}, syncAll)
    .on('postgres_changes', {event:'*', schema:'public', table:'cards'}, syncAll)
    .on('postgres_changes', {event:'*', schema:'public', table:'transactions'}, syncAll)
    .on('postgres_changes', {event:'*', schema:'public', table:'notifications'}, syncAll)
    .on('postgres_changes', {event:'*', schema:'public', table:'recharge_requests'}, syncAll)
    .on('postgres_changes', {event:'*', schema:'public', table:'withdraw_requests'}, syncAll)
    .on('postgres_changes', {event:'*', schema:'public', table:'parent_pending'}, syncAll)
    .subscribe();
}

async function createAdmin(){
  const nom=document.getElementById('ga-nom').value.trim();
  const prenom=document.getElementById('ga-prenom').value.trim();
  const genre=document.getElementById('ga-genre').value;
  const pass=document.getElementById('ga-pass').value;
  if(!nom||!prenom||!pass){ document.getElementById('gate-err').style.display='block'; return; }
  const id = genId('ADM');
  await sb.from('bank_admins').insert({id,nom,prenom,genre,password:pass});
  currentAdmin = {id,nom,prenom,genre};
  enterApp();
}
function renderGateLogin(admins){
  document.getElementById('gate-body').innerHTML = `
    <div class="field" style="text-align:left;"><label style="color:#A9B8E4;">Administrateur</label>
      <select id="ga-select" style="width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:#fff;font-size:14px;">

      </select>
    </div>
    <input id="gate-pass" type="password" placeholder="Mot de passe">
    <div id="gate-err" class="gate-err" style="display:none;">Mot de passe incorrect.</div>
    <button onclick="gateLogin()">Accéder au dashboard</button>
    <div class="gate-hint">Seul ce dashboard peut créer des comptes parents pour "index".</div>
  `;
  window._admins = admins;
}
async function gateLogin(){
  const id = document.getElementById('ga-select').value;
  const pass = document.getElementById('gate-pass').value;
  const admin = window._admins.find(a=>a.id===id);
  if(!admin || admin.password!==pass){ document.getElementById('gate-err').style.display='block'; return; }
  currentAdmin = admin;
  enterApp();
}
async function enterApp(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--muted);">Chargement des données…</div>`;
  try{ await loadFromSupabase(); }catch(e){ console.error('Supabase load failed',e); }
  renderApp();
  startRealtime();
  try{ if(!localStorage.getItem('huma_admin_tuto_seen')) showTutoriel(); }catch(e){}
}

async function createParentPending(){
  const relation = document.getElementById('cp-relation').value;
  const fatherNom = document.getElementById('cp-father-nom').value.trim();
  const fatherPrenom = document.getElementById('cp-father-prenom').value.trim();
  const motherNom = document.getElementById('cp-mother-nom').value.trim();
  const motherPrenom = document.getElementById('cp-mother-prenom').value.trim();
  const auntNom = document.getElementById('cp-aunt-nom').value.trim();
  const auntPrenom = document.getElementById('cp-aunt-prenom').value.trim();
  const uncleNom = document.getElementById('cp-uncle-nom').value.trim();
  const unclePrenom = document.getElementById('cp-uncle-prenom').value.trim();
  const eleveNom = document.getElementById('cp-eleve-nom').value.trim();
  const elevePrenom = document.getElementById('cp-eleve-prenom').value.trim();
  const classe = document.getElementById('cp-classe').value;
  if(relation==='pere' && (!fatherNom||!fatherPrenom)){ toast('Nom et prénom du père requis'); return; }
  if(relation==='mere' && (!motherNom||!motherPrenom)){ toast('Nom et prénom de la mère requis'); return; }
  if(!eleveNom||!elevePrenom){ toast("Nom et prénom de l'élève requis"); return; }
  let code; do{ code=String(Math.floor(100000+Math.random()*899999)); }while(PARENT_PENDING.some(p=>p.code===code));
  await sb.from('parent_pending').insert({
    code, relation, father_nom:fatherNom||null, father_prenom:fatherPrenom||null,
    mother_nom:motherNom||null, mother_prenom:motherPrenom||null,
    aunt_nom:auntNom||null, aunt_prenom:auntPrenom||null, uncle_nom:uncleNom||null, uncle_prenom:unclePrenom||null,
    eleve_nom:eleveNom, eleve_prenom:elevePrenom, classe, status:'pending',
  });
  closeModal();
  openModal(`
    <button class="close-x" onclick="closeModal()">${icon('x',14)}</button>
    <div style="text-align:center;">
      <h3>Code généré</h3>
      <p style="color:var(--muted);font-size:12.5px;">Communiquez ce code oralement au parent — il devra le saisir dans l'app "index" pour créer son mot de passe.</p>

      <button class="btn primary" style="width:100%;" onclick="closeModal();go('parents')">Terminé</button>

}

async function toggleSuspend(num){
  const a=ACCOUNTS[num]; a.status = a.status==='suspended'?'active':'suspended';
  await sb.from('accounts').update({status:a.status}).eq('number',num);
  closeModal(); renderPage(); toast(a.status==='suspended'?'Compte suspendu':'Compte réactivé');
}
function openRecharge(num){
  openModal(`<button class="close-x" onclick="closeModal()">${icon('x',14)}</button><h3>Recharger le compte</h3>
  <div class="field"><label>Montant</label><input id="rc-a" type="number" placeholder="0"></div>
  <button class="btn primary" style="width:100%;" onclick="doRecharge('${num}')">Recharger</button>`);
}
async function doRecharge(num){
  const amt=parseFloat(document.getElementById('rc-a').value);
  if(!amt||amt<=0){ toast('Montant invalide'); return; }
  const acc=ACCOUNTS[num]; acc.balance+=amt;
  const tx = {id:genId('HB'),desc:'Recharge administrative',cat:'Dépôt',amount:amt,date:new Date()};
  acc.transactions.unshift(tx);
  await Promise.all([
    sb.from('accounts').update({balance:acc.balance}).eq('number',num),
    sb.from('transactions').insert({id:tx.id, account_number:num, description:tx.desc, category:tx.cat, amount:tx.amount}),
  ]);
  closeModal(); renderPage(); toast('Compte rechargé');
}
function openDebit(num){
  openModal(`<button class="close-x" onclick="closeModal()">${icon('x',14)}</button><h3>Débiter le compte</h3>
  <p style="font-size:12px;color:var(--muted);margin-top:-6px;">Une opération financière tracée sera créée — le solde n'est jamais modifié directement.</p>
  <div class="field"><label>Montant</label><input id="db-a" type="number" placeholder="0"></div>
  <button class="btn primary" style="width:100%;" onclick="doDebit('${num}')">Débiter</button>`);
}
async function doDebit(num){
  const amt=parseFloat(document.getElementById('db-a').value);
  const acc=ACCOUNTS[num];
  if(!amt||amt<=0){ toast('Montant invalide'); return; }
  if(amt>acc.balance){ toast('Solde insuffisant'); return; }
  acc.balance-=amt;
  const tx = {id:genId('HB'),desc:'Débit administratif',cat:'Retrait',amount:-amt,date:new Date()};
  acc.transactions.unshift(tx);
  await Promise.all([
    sb.from('accounts').update({balance:acc.balance}).eq('number',num),
    sb.from('transactions').insert({id:tx.id, account_number:num, description:tx.desc, category:tx.cat, amount:tx.amount}),
  ]);
  closeModal(); renderPage(); toast('Compte débité');
}

let txFilterType='Tous';
function dayLabel(d){
  const days = Math.floor((Date.now()-d.getTime())/86400000);
  if(days<=0) return "Aujourd'hui";
  if(days===1) return 'Hier';
  return d.toLocaleDateString('fr-FR');
}
function pgTransactions(){
  const types=['Tous','Dépôt','Transfert','Reçu','Retrait','Cafétéria'];
  let all = allAccounts().flatMap(a=>a.transactions.map(t=>({...t,who:a.name})));
  if(txFilterType!=='Tous') all = all.filter(t=>t.cat===txFilterType);
  all.sort((a,b)=>b.date-a.date);
  const groups={};
  all.slice(0,80).forEach(t=>{ const g=dayLabel(t.date); (groups[g]=groups[g]||[]).push(t); });
  return `
  <div class="page-title"><div><h1>Transactions</h1><p>${all.length} transaction(s)</p></div></div>

  ${Object.keys(groups).length===0?`<div class="card"><div class="empty">Aucune transaction</div></div>`:
  Object.entries(groups).map(([label,rows])=>`
    <div class="card-head" style="margin:18px 0 8px;"><h3 style="font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">${label}</h3></div>

          <td>${r.status==='pending'?`<div style="display:flex;gap:6px;"><button class="btn ok" onclick="handleReq('${r.kind}','${r.id}',true)">✓</button><button class="btn danger" onclick="handleReq('${r.kind}','${r.id}',false)">✕</button></div>`:'—'}</td>
        </tr>`).join('') || `<tr><td colspan="6"><div class="empty">Aucune notification</div></td></tr>`}

async function handleReq(kind,id,approve){
  const list = kind==='Recharge'?RECHARGE_REQUESTS:WITHDRAW_REQUESTS;
  const table = kind==='Recharge' ? 'recharge_requests' : 'withdraw_requests';
  const r = list.find(x=>x.id===id);
  const acc = ACCOUNTS[r.accountNumber];
  if(approve){
    let tx, notifText;
    if(kind==='Recharge'){ acc.balance+=r.amount; tx={id:genId('HB'),desc:'Recharge '+r.method+' approuvée',cat:'Dépôt',amount:r.amount,date:new Date()}; notifText=`Votre recharge de ${fmt(r.amount)} a été approuvée.`; }
    else { acc.balance-=r.total; tx={id:genId('HB'),desc:'Retrait approuvé',cat:'Retrait',amount:-r.total,date:new Date()}; notifText=`Votre retrait de ${fmt(r.amount)} a été approuvé.`; }
    acc.transactions.unshift(tx);
    r.status='approved';
    const notifId = genId('N');
    await Promise.all([
      sb.from('accounts').update({balance:acc.balance}).eq('number',acc.number),
      sb.from('transactions').insert({id:tx.id, account_number:acc.number, description:tx.desc, category:tx.cat, amount:tx.amount}),
      sb.from(table).update({status:'approved'}).eq('id',id),
      sb.from('notifications').insert({id:notifId, account_number:acc.number, text:notifText, read:false}),
    ]);
  } else {
    r.status='rejected';
    const notifId = genId('N');
    const notifText = `Votre demande de ${kind.toLowerCase()} (${fmt(r.amount)}) a été refusée.`;
    await Promise.all([
      sb.from(table).update({status:'rejected'}).eq('id',id),
      sb.from('notifications').insert({id:notifId, account_number:acc.number, text:notifText, read:false}),
    ]);
  }
  renderPage(); toast(approve?'Demande approuvée':'Demande refusée');
}

    <div class="card-head" style="margin:18px 0 8px;"><h3 style="font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">${app}</h3></div>

      ${items.map(d=>`
        <div class="trow" style="cursor:default;">
          <div class="tleft"><b style="display:flex;align-items:center;gap:8px;">${d.terme}<span style="width:7px;height:7px;border-radius:50%;background:${badgeColor[d.app]};display:inline-block;flex-shrink:0;"></span></b><small style="white-space:normal;line-height:1.5;">${d.def}</small></div>

  `;
}

let tutoStep = 0;
function showTutoriel(){
  tutoStep = 0;

function renderTutoStep(){

  document.getElementById('didacticiel').innerHTML = `
    <div class="tuto-card">

/* ============================================================
   CHARTS — flux navy marine en direct
============================================================ */
function pushSeries(){
  const last = state.financeSeries[state.financeSeries.length-1];
  let next = last + (Math.random()*16-8);
  next = Math.max(15,Math.min(125,next));
  state.financeSeries.push(next);
  if(state.financeSeries.length>28) state.financeSeries.shift();
  if(state.displaySeries.length<state.financeSeries.length) state.displaySeries.push(next);
}
const CHART_HEIGHTS = {'fin-chart':110,'an-fin-chart':150,'role-chart':110};
function setupCanvas(cv){
  const w = Math.min(Math.max(cv.parentElement.clientWidth||300, 60), window.innerWidth-20);
  const h = CHART_HEIGHTS[cv.id] || 110;
  const dpr = window.devicePixelRatio||1;
  cv.width = w*dpr; cv.height = h*dpr;
  cv.style.width = w+'px'; cv.style.height = h+'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w,h};
}
function drawLineFlux(id,data,color,fillColor){
  const cv = document.getElementById(id);
  if(!cv) return;
  const {ctx,w,h} = setupCanvas(cv);
  ctx.clearRect(0,0,w,h);
  const min=Math.min(...data), max=Math.max(...data), pad=8;
  const range=(max-min)||1;
  const stepX=(w-pad*2)/(data.length-1);
  const pts = data.map((v,i)=>[pad+i*stepX, h-pad-((v-min)/range)*(h-pad*2)]);
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; const mx=(x0+x1)/2; ctx.bezierCurveTo(mx,y0,mx,y1,x1,y1); }
  ctx.lineTo(pts[pts.length-1][0],h); ctx.lineTo(pts[0][0],h); ctx.closePath();
  ctx.fillStyle=fillColor; ctx.fill();
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; const mx=(x0+x1)/2; ctx.bezierCurveTo(mx,y0,mx,y1,x1,y1); }
  ctx.strokeStyle=color; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
  const last=pts[pts.length-1];
  ctx.beginPath(); ctx.arc(last[0],last[1],4,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();
}
function drawDoughnutChart(id,data,colors){
  const cv = document.getElementById(id);
  if(!cv) return;
  const {ctx,w,h} = setupCanvas(cv);
  ctx.clearRect(0,0,w,h);
  const total = data.reduce((a,b)=>a+b,0)||1;
  const cx=w/2, cy=h/2, r=Math.min(w,h)/2-4, inner=r*0.6;
  let start=-Math.PI/2;
  data.forEach((v,i)=>{
    const angle=(v/total)*Math.PI*2;
    ctx.beginPath(); ctx.arc(cx,cy,r,start,start+angle); ctx.arc(cx,cy,inner,start+angle,start,true); ctx.closePath();
    ctx.fillStyle=colors[i%colors.length]; ctx.fill();
    start+=angle;
  });
}
function drawBarChart(id,labels,data,color){
  const cv = document.getElementById(id);
  if(!cv) return;
  const {ctx,w,h} = setupCanvas(cv);
  ctx.clearRect(0,0,w,h);
  if(data.length===0) return;
  const max = Math.max(...data)||1, pad=6, gap=8;
  const bw = (w-pad*2-gap*(data.length-1))/data.length;
  ctx.font='10px Inter, sans-serif'; ctx.fillStyle='#647096'; ctx.textAlign='center';
  data.forEach((v,i)=>{
    const bh=(v/max)*(h-26);
    const x=pad+i*(bw+gap), y=h-20-bh;
    ctx.fillStyle=color;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,bw,bh,4) : ctx.rect(x,y,bw,bh); ctx.fill();
    ctx.fillStyle='#647096';
    ctx.fillText((labels[i]||'').slice(0,8), x+bw/2, h-6);
  });
}
function drawCharts(){
  drawLineFlux('fin-chart', state.displaySeries, '#0A1B3D', 'rgba(10,27,61,.15)');
  drawLineFlux('an-fin-chart', state.displaySeries, '#0A1B3D', 'rgba(10,27,61,.15)');
  drawDoughnutChart('role-chart', [roleCount('eleve'),roleCount('professeur'),roleCount('personnel'),roleCount('parent')], ['#0C2350','#2748A0','#3E5FC4','#8FA6F5']);
  const cats={}; allAccounts().forEach(a=>a.transactions.filter(t=>t.amount<0).forEach(t=>{cats[t.cat]=(cats[t.cat]||0)+Math.abs(t.amount);}));
  drawBarChart('an-cat-chart', Object.keys(cats), Object.values(cats), '#0A1B3D');
}
function ensureTicker(){
  if(ticker) return;
  ticker = setInterval(pushSeries, 1500);
  function frame(){
    for(let i=0;i<state.financeSeries.length;i++){
      const target = state.financeSeries[i];
      const cur = state.displaySeries[i] ?? target;
      state.displaySeries[i] = cur + (target-cur)*0.06;
    }
    while(state.displaySeries.length>state.financeSeries.length) state.displaySeries.shift();
    drawLineFlux('fin-chart', state.displaySeries, '#0A1B3D', 'rgba(10,27,61,.15)');
    drawLineFlux('an-fin-chart', state.displaySeries, '#0A1B3D', 'rgba(10,27,61,.15)');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
